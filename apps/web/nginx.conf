server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para optimizar ancho de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/manifest+json
        image/svg+xml;

    # Encabezados de seguridad (paridad exacta con apps/web/vercel.json)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(self), serial=(self)" always;

    # Assets inmutables con hash (1 año de caché)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker, PWA Workbox y archivo raíz HTML: no cachear agresivamente
    location ~* ^/(sw\.js|workbox-.*\.js|index\.html)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Manifest PWA con tipo MIME explícito
    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/manifest+json;
    }

    # Endpoint de salud para Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: cualquier ruta desconocida se redirige a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
