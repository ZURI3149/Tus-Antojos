# CI de Tus Antojos (spec platform §2.1 · T16).
# No necesita secretos: las pruebas de integración usan un Supabase local en Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En un PR, un push nuevo cancela la ejecución anterior; en main se completan todas.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  quality:
    name: Calidad (lint, tipos, unitarias, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v6

      - name: Instalar Node (versión de .nvmrc) con caché de pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integración (Supabase local, test:db, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v6

      - name: Instalar Node (versión de .nvmrc) con caché de pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Caché de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar Chromium y sus dependencias del sistema
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tus-antojos/web exec playwright install --with-deps chromium

      - name: Instalar solo las dependencias del sistema (navegador en caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tus-antojos/web exec playwright install-deps chromium

      - name: Levantar Supabase local (aplica migraciones y seed)
        run: pnpm db:start:ci

      - name: Compilar el paquete compartido
        run: pnpm build:shared

      - name: Pruebas de base de datos e integración de la API
        run: pnpm test:db

      - name: Pruebas E2E (Playwright; levanta la API y la web)
        run: pnpm test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
